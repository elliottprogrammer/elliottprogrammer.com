  <body id="particle-slider">
    <div class="slides">
        <div id="first-slide" class="slide"></div>
    </div>
  	<canvas class="draw"></canvas>
    
    <script>
        var deviceDetector = (function () {
            var ua = navigator.userAgent.toLowerCase();
            var detect = (function(s) 	{
                if (s===undefined) s=ua;
                else ua = s.toLowerCase();
                if (/(ipad|tablet|(android(?!.*mobile))|(windows(?!.*phone)(.*touch))|kindle|playbook|silk|(puffin(?!.*(IP|AP|WP))))/.test(ua))
                    return 'tablet';
                else
                    if(/(mobi|ipod|phone|blackberry|opera mini|fennec|minimo|symbian|psp|nintendo ds|archos|skyfire|puffin|blazer|bolt|gobrowser|iris|maemo|semc|teashark|uzard)/.test(ua))            
                        return 'phone';
                    else return 'desktop';
            });
            
            return {
                device:detect(),
                detect:detect,
                isMobile:( (detect() != 'desktop') ? true : false ),
                userAgent:ua
            };
        }());
        var init = function() {
            var logoImgSrc;
            switch(deviceDetector.device) {
                case 'phone':
                    logoImgSrc = './bryan-elliott-logo_mobile.png';
                    break;
                case 'tablet':
                    logoImgSrc = './bryan-elliott-logo_tablet.png';
                    break;
                case 'desktop':
                    logoImgSrc = './bryan-elliott-logo_desktop.png';
                    break;
                default:
                    logoImgSrc = './bryan-elliott-logo_desktop.png';
            }
            console.log(logoImgSrc);
            var logoImage = new Image();
            logoImage.src = logoImgSrc;
            
            var ps = new ParticleSlider({
                ptlGap: deviceDetector.device == 'phone' ? 3 : 0,
                ptlSize: deviceDetector.device == 'phone' ? 3 : 1,
                width: 1e9,
                height: 1e9,
                yOffset: -300,
                imgs: [logoImage]
            });
            
            (window.addEventListener
            ? window.addEventListener('click', function(){ps.init(true)}, false)
            : window.onclick = function(){ps.init(true)});
        }

        var initParticleSlider = function(){
            var psScript = document.createElement('script');
            (psScript.addEventListener
                ? psScript.addEventListener('load', init, false)
                : psScript.onload = init);
            psScript.src = './particleSlider.js';
                psScript.setAttribute('type', 'text/javascript');
            document.body.appendChild(psScript);
        }
            
        (window.addEventListener
        ? window.addEventListener('load', initParticleSlider, false)
        : window.onload = initParticleSlider);

    </script>
